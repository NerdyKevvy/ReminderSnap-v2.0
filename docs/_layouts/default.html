<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <style>
    :root{color-scheme:dark;--bg:#0e1012;--surface:#191c20;--ink:#ecedf0;--muted:#b0b6c0;--line:#353a42}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header,main,footer{max-width:900px;margin:auto;padding:28px}header{display:flex;gap:24px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
    header>a{font-size:21px;font-weight:650;text-decoration:none}nav{display:flex;gap:24px;margin-left:auto;font-size:14px}
    a{color:#d9e5ff;text-underline-offset:4px}a:hover{color:white}a:focus-visible{outline:2px solid white;outline-offset:5px}
    h1{font-size:clamp(32px,7vw,58px);line-height:1.08;letter-spacing:-.04em;margin:35px 0 25px}h2{font-size:25px;line-height:1.3;margin-top:45px}h3{font-size:19px}
    p,li{color:var(--muted)}strong{color:var(--ink)}li{margin:9px 0}hr{border:0;border-top:1px solid var(--line);margin:45px 0}
    code{overflow-wrap:anywhere;font-size:.9em;background:var(--surface);padding:2px 5px;border-radius:4px}p a,li a{overflow-wrap:anywhere}
    .eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase}.cta{display:inline-block;border-radius:10px;padding:12px 20px;background:#e2e6ec;color:#121519;text-decoration:none;font-weight:600}.cta:hover{color:#121519;background:white}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:32px 0}.steps div{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:22px}.steps b{display:block;font-size:22px}.steps span{font-size:14px;color:var(--muted)}
    footer{border-top:1px solid var(--line);font-size:13px;color:var(--muted);margin-top:50px}@media(max-width:600px){header,main,footer{padding:22px}nav{margin-left:0}.steps{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><a href="{{ '/' | relative_url }}">ReminderSnap</a><nav aria-label="Main navigation"><a href="{{ '/privacy.html' | relative_url }}">Privacy / 隐私</a><a href="{{ '/support.html' | relative_url }}">Support / 支持</a></nav></header>
<main>{{ content }}</main>
<footer>ReminderSnap · Junhan Li / NerdyKevvy · <a href="https://github.com/NerdyKevvy/ReminderSnap-v2.0">Source on GitHub</a></footer>
</body>
</html>
